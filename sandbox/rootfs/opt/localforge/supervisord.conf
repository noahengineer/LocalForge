; LocalForge sandbox process supervisor. Runs as the unprivileged `dev` user.
[unix_http_server]
file=/tmp/localforge/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/tmp/localforge/logs/supervisord.log
pidfile=/tmp/localforge/supervisord.pid
childlogdir=/tmp/localforge/logs
logfile_maxbytes=5MB
logfile_backups=1

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/localforge/supervisor.sock

; --- The agent's desktop: TigerVNC X server on :1 (VNC only on the container's loopback) ---
[program:xvnc]
command=/opt/localforge/bin/run-xvnc
priority=10
autorestart=true
stdout_logfile=/tmp/localforge/logs/xvnc.log
redirect_stderr=true

[program:desktop]
command=/opt/localforge/bin/run-desktop
priority=20
autorestart=true
startsecs=3
stdout_logfile=/tmp/localforge/logs/desktop.log
redirect_stderr=true

; --- noVNC websocket bridge, published to the host for the app's Agent's Desktop panel ---
[program:novnc]
command=/opt/localforge/bin/run-novnc
priority=30
autorestart=true
stdout_logfile=/tmp/localforge/logs/novnc.log
redirect_stderr=true

; --- OpenCode headless server (the agent engine) ---
[program:opencode]
command=/opt/localforge/bin/run-opencode
priority=40
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/localforge/logs/opencode.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true
